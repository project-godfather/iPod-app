<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod Classic</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #121212;
      --ipod-body: #e0e0e0;
      --ipod-border: #b0b0b0;
      --screen-bg: #cbe4bf;
      --screen-text: #1a2a1a;
      --wheel-bg: #ffffff;
      --wheel-text: #555555;
      --center-btn: #e6e6e6;
      --accent: #2e522b;
      --highlight-bg: #2e522b;
      --highlight-text: #ffffff;
    }

    body.dark-theme {
      --ipod-body: #222222;
      --ipod-border: #111111;
      --screen-bg: #1c2b1e;
      --screen-text: #7cd989;
      --wheel-bg: #111111;
      --wheel-text: #aaaaaa;
      --center-btn: #1d1d1d;
      --accent: #50b05e;
      --highlight-bg: #50b05e;
      --highlight-text: #000000;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
    }

    /* iPod Body Shell */
    .ipod-container {
      width: 340px;
      height: 560px;
      background: linear-gradient(145deg, var(--ipod-body), #f0f0f0);
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -3px 5px rgba(0,0,0,0.2);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      border: 1px solid var(--ipod-border);
      transition: background 0.3s, border 0.3s;
    }

    /* iPod Screen Wrapper */
    .screen-outer {
      width: 100%;
      height: 220px;
      background-color: #0d0d0d;
      border-radius: 12px;
      padding: 10px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.4);
      display: flex;
    }

    /* Monochrome LCD Screen */
    .screen-inner {
      width: 100%;
      height: 100%;
      background-color: var(--screen-bg);
      color: var(--screen-text);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Screen Header */
    .screen-header {
      height: 24px;
      background: rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(0,0,0,0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .battery-icon {
      width: 18px;
      height: 9px;
      border: 1px solid var(--screen-text);
      border-radius: 1px;
      padding: 1px;
      display: flex;
      position: relative;
    }
    .battery-icon::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 3px;
      background-color: var(--screen-text);
    }
    .battery-level {
      height: 100%;
      width: 80%;
      background-color: var(--screen-text);
    }

    /* Screen Main Content Area */
    .screen-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Menu List */
    .menu-list {
      list-style: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    .menu-item {
      padding: 5px 10px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-item.active {
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .menu-item .chevron {
      font-size: 10px;
    }

    /* Now Playing View */
    .now-playing {
      padding: 10px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .np-top {
      display: flex;
      gap: 12px;
      align-items: center;
      height: 105px;
    }

    .album-art {
      width: 95px;
      height: 95px;
      background-color: rgba(0,0,0,0.1);
      border: 1px solid rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-meta {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-meta .title {
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-meta .artist, .track-meta .album {
      font-size: 11px;
      opacity: 0.85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress & Volume Bars */
    .progress-section {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .progress-bar-container {
      height: 8px;
      background-color: rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--screen-text);
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
    }

    /* Click Wheel Shell */
    .wheel-outer {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background-color: var(--wheel-bg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 1px 2px rgba(255,255,255,0.8), inset 0 -2px 5px rgba(0,0,0,0.1);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: none;
      transition: background-color 0.3s;
    }

    .wheel-label {
      position: absolute;
      font-weight: 700;
      font-size: 13px;
      color: var(--wheel-text);
      letter-spacing: 0.5px;
    }

    .label-menu { top: 16px; }
    .label-prev { left: 18px; }
    .label-next { right: 18px; }
    .label-play { bottom: 16px; }

    /* Center Select Button */
    .wheel-center {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff, var(--center-btn));
      box-shadow: 0 2px 5px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,1);
      border: 1px solid rgba(0,0,0,0.08);
      z-index: 10;
    }

    .wheel-center:active {
      background: var(--center-btn);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    /* Hidden File Input */
    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="ipod-container">
    <!-- LCD Screen -->
    <div class="screen-outer">
      <div class="screen-inner">
        <div class="screen-header">
          <span id="header-title">iPod</span>
          <span id="play-state-icon">⏸</span>
          <div class="battery-icon"><div class="battery-level"></div></div>
        </div>

        <div class="screen-body" id="screen-body">
          <!-- Dynamically populated via JS -->
        </div>
      </div>
    </div>

    <!-- Click Wheel Controls -->
    <div class="wheel-outer" id="click-wheel">
      <span class="wheel-label label-menu" id="btn-menu">MENU</span>
      <span class="wheel-label label-prev" id="btn-prev">|&#9664;&#9664;</span>
      <span class="wheel-label label-next" id="btn-next">&#9654;&#9654;|</span>
      <span class="wheel-label label-play" id="btn-play">&#9654;&#10074;&#10074;</span>
      
      <div class="wheel-center" id="btn-center"></div>
    </div>
  </div>

  <input type="file" id="file-input" accept="audio/*" multiple>
  <audio id="audio-player"></audio>

  <script>
    /* ===================================================
       1. IndexedDB Setup for Persistent Local File Storage
       =================================================== */
    let db;
    const request = indexedDB.open("iPodMusicDB", 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("songs")) {
        db.createObjectStore("songs", { keyPath: "id", autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      loadSongsFromDB();
    };

    /* ===================================================
       2. Application State & Audio Management
       =================================================== */
    const audio = document.getElementById('audio-player');
    const fileInput = document.getElementById('file-input');
    const screenBody = document.getElementById('screen-body');
    const headerTitle = document.getElementById('header-title');
    const playStateIcon = document.getElementById('play-state-icon');

    let songs = [];
    let currentMenu = 'main'; // 'main', 'songs', 'nowPlaying', 'settings'
    let selectedIndex = 0;
    let currentSongIndex = -1;
    let isClickSoundEnabled = true;

    // Hard Drive Buffer Simulation
    const HDD_BUFFER_DELAY = 400; // 400ms delay to simulate original iPod disk seek

    // Button Long Press / Hold State Management
    let holdTimer = null;
    let seekInterval = null;
    let isHolding = false;

    // Audio Click Synthesizer for Click Wheel
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickSound() {
      if (!isClickSoundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.015);
    }

    /* Save uploaded files into IndexedDB */
    function saveFilesToDB(files) {
      const transaction = db.transaction(["songs"], "readwrite");
      const store = transaction.objectStore("songs");

      Array.from(files).forEach(file => {
        const songData = {
          name: file.name.replace(/\.[^/.]+$/, ""),
          artist: "Unknown Artist",
          album: "Local Music",
          blob: file
        };
        store.add(songData);
      });

      transaction.oncomplete = () => {
        loadSongsFromDB();
      };
    }

    /* Retrieve stored files from IndexedDB */
    function loadSongsFromDB() {
      if (!db) return;
      const transaction = db.transaction(["songs"], "readonly");
      const store = transaction.objectStore("songs");
      const getAll = store.getAll();

      getAll.onsuccess = () => {
        songs = getAll.result.map(song => ({
          ...song,
          url: URL.createObjectURL(song.blob)
        }));
        renderMenu();
      };
    }

    /* Clear persistent database */
    function clearLibrary() {
      const transaction = db.transaction(["songs"], "readwrite");
      const store = transaction.objectStore("songs");
      store.clear().onsuccess = () => {
        songs = [];
        audio.pause();
        audio.src = '';
        currentSongIndex = -1;
        renderMenu();
      };
    }

    /* ===================================================
       3. Interface Navigation & Rendering
       =================================================== */
    const menus = {
      main: [
        { label: 'Now Playing', action: () => navigateTo('nowPlaying') },
        { label: 'Songs', action: () => navigateTo('songs') },
        { label: 'Settings', action: () => navigateTo('settings') }
      ],
      settings: [
        { label: 'Add Songs...', action: () => fileInput.click() },
        { label: 'Toggle Theme', action: () => document.body.classList.toggle('dark-theme') },
        { label: 'Click Sound: ON/OFF', action: () => { isClickSoundEnabled = !isClickSoundEnabled; } },
        { label: 'Clear Library', action: () => clearLibrary() }
      ]
    };

    function navigateTo(menuKey) {
      if (menuKey === 'nowPlaying' && currentSongIndex === -1) return;
      currentMenu = menuKey;
      selectedIndex = 0;
      renderMenu();
    }

    function renderMenu() {
      screenBody.innerHTML = '';

      if (currentMenu === 'nowPlaying') {
        headerTitle.innerText = "Now Playing";
        const song = songs[currentSongIndex] || { name: "No Track", artist: "-", album: "-" };
        
        screenBody.innerHTML = `
          <div class="now-playing">
            <div class="np-top">
              <div class="album-art">🎵</div>
              <div class="track-meta">
                <div class="title">${song.name}</div>
                <div class="artist">${song.artist}</div>
                <div class="album">${song.album}</div>
              </div>
            </div>
            <div class="progress-section">
              <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
              </div>
              <div class="time-stamps">
                <span id="time-curr">0:00</span>
                <span id="time-rem">-0:00</span>
              </div>
            </div>
          </div>
        `;
        updateProgress();
        return;
      }

      let items = [];
      if (currentMenu === 'main') {
        headerTitle.innerText = "iPod";
        items = menus.main;
      } else if (currentMenu === 'settings') {
        headerTitle.innerText = "Settings";
        items = menus.settings;
      } else if (currentMenu === 'songs') {
        headerTitle.innerText = "Songs";
        items = songs.length > 0 
          ? songs.map((s, idx) => ({ label: s.name, action: () => playSong(idx) }))
          : [{ label: 'No Songs Found', action: () => {} }];
      }

      const ul = document.createElement('ul');
      ul.className = 'menu-list';

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `menu-item ${index === selectedIndex ? 'active' : ''}`;
        li.innerHTML = `<span>${item.label}</span><span class="chevron">&#10095;</span>`;
        ul.appendChild(li);
      });

      screenBody.appendChild(ul);

      // Scroll active item into view
      const activeEl = ul.children[selectedIndex];
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
    }

    /* ===================================================
       4. Audio Playback Engine & Delay Logic
       =================================================== */
    function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentSongIndex = index;
      const song = songs[currentSongIndex];

      audio.pause();
      audio.src = song.url;
      audio.load();

      playStateIcon.innerText = "⏳"; // Hard drive buffer indicator

      // Simulate iPod hard drive spin-up delay
      setTimeout(() => {
        audio.play().then(() => {
          playStateIcon.innerText = "▶";
          updateMediaSession(song);
        }).catch(e => console.error(e));
      }, HDD_BUFFER_DELAY);

      navigateTo('nowPlaying');
    }

    function togglePlayPause() {
      if (currentSongIndex === -1 && songs.length > 0) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        playStateIcon.innerText = "▶";
      } else {
        audio.pause();
        playStateIcon.innerText = "⏸";
      }
    }

    /* Smart Rewind Logic: Restart song if > 3s, else go to previous track */
    function handlePreviousTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        if (currentSongIndex > 0) {
          playSong(currentSongIndex - 1);
        } else {
          audio.currentTime = 0;
        }
      }
    }

    function handleNextTrack() {
      if (currentSongIndex < songs.length - 1) {
        playSong(currentSongIndex + 1);
      }
    }

    /* Fast Forward & Rewind Seeking Engine */
    function startSeeking(direction) {
      isHolding = false;
      holdTimer = setTimeout(() => {
        isHolding = true;
        seekInterval = setInterval(() => {
          if (direction === 'ff') {
            audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 2);
          } else if (direction === 'rw') {
            audio.currentTime = Math.max(0, audio.currentTime - 2);
          }
          playClickSound();
        }, 150);
      }, 300);
    }

    function stopSeeking(direction) {
      clearTimeout(holdTimer);
      clearInterval(seekInterval);
      if (!isHolding) {
        // Registered as a normal short press tap
        if (direction === 'ff') handleNextTrack();
        if (direction === 'rw') handlePreviousTrack();
      }
      isHolding = false;
    }

    /* iOS Lock Screen MediaSession Controls */
    function updateMediaSession(song) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.name,
          artist: song.artist,
          album: song.album
        });

        navigator.mediaSession.setActionHandler('play', () => { audio.play(); playStateIcon.innerText = "▶"; });
        navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); playStateIcon.innerText = "⏸"; });
        navigator.mediaSession.setActionHandler('previoustrack', () => handlePreviousTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => handleNextTrack());
      }
    }

    function formatTime(secs) {
      if (isNaN(secs)) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateProgress() {
      if (currentMenu !== 'nowPlaying') return;
      const fill = document.getElementById('progress-fill');
      const timeCurr = document.getElementById('time-curr');
      const timeRem = document.getElementById('time-rem');

      if (fill && audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        fill.style.width = `${pct}%`;
        timeCurr.innerText = formatTime(audio.currentTime);
        timeRem.innerText = `-${formatTime(audio.duration - audio.currentTime)}`;
      }
    }

    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', () => handleNextTrack());

    /* ===================================================
       5. Interactive Click Wheel Drag & Touch Listener
       =================================================== */
    const wheel = document.getElementById('click-wheel');
    let lastAngle = null;
    let accumulatedRotation = 0;

    function getAngle(x, y) {
      const rect = wheel.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(y - cy, x - cx) * (180 / Math.PI);
    }

    function handleWheelMove(clientX, clientY) {
      const angle = getAngle(clientX, clientY);
      if (lastAngle !== null) {
        let delta = angle - lastAngle;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;

        accumulatedRotation += delta;

        // Step threshold for menu selection or volume control
        if (Math.abs(accumulatedRotation) >= 18) {
          playClickSound();
          if (currentMenu === 'nowPlaying') {
            // Adjust volume when dragging in Now Playing view
            const volDelta = accumulatedRotation > 0 ? 0.05 : -0.05;
            audio.volume = Math.max(0, Math.min(1, audio.volume + volDelta));
          } else {
            // Scroll menu lists
            const itemsLength = currentMenu === 'main' ? menus.main.length 
                              : currentMenu === 'settings' ? menus.settings.length 
                              : songs.length;
            
            if (itemsLength > 0) {
              if (accumulatedRotation > 0) {
                selectedIndex = (selectedIndex + 1) % itemsLength;
              } else {
                selectedIndex = (selectedIndex - 1 + itemsLength) % itemsLength;
              }
              renderMenu();
            }
          }
          accumulatedRotation = 0;
        }
      }
      lastAngle = angle;
    }

    wheel.addEventListener('touchstart', (e) => {
      lastAngle = getAngle(e.touches[0].clientX, e.touches[0].clientY);
      accumulatedRotation = 0;
    }, { passive: true });

    wheel.addEventListener('touchmove', (e) => {
      handleWheelMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    wheel.addEventListener('touchend', () => { lastAngle = null; });

    /* Button Action Assignments */
    document.getElementById('btn-center').addEventListener('click', (e) => {
      e.stopPropagation();
      playClickSound();
      if (currentMenu === 'main') menus.main[selectedIndex].action();
      else if (currentMenu === 'settings') menus.settings[selectedIndex].action();
      else if (currentMenu === 'songs' && songs.length > 0) playSong(selectedIndex);
    });

    document.getElementById('btn-menu').addEventListener('click', (e) => {
      e.stopPropagation();
      playClickSound();
      if (currentMenu !== 'main') navigateTo('main');
    });

    document.getElementById('btn-play').addEventListener('click', (e) => {
      e.stopPropagation();
      playClickSound();
      togglePlayPause();
    });

    // Fast Forward button listeners
    const nextBtn = document.getElementById('btn-next');
    nextBtn.addEventListener('mousedown', () => startSeeking('ff'));
    nextBtn.addEventListener('mouseup', () => stopSeeking('ff'));
    nextBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); startSeeking('ff'); }, { passive: true });
    nextBtn.addEventListener('touchend', (e) => { e.stopPropagation(); stopSeeking('ff'); });

    // Fast Rewind button listeners
    const prevBtn = document.getElementById('btn-prev');
    prevBtn.addEventListener('mousedown', () => startSeeking('rw'));
    prevBtn.addEventListener('mouseup', () => stopSeeking('rw'));
    prevBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); startSeeking('rw'); }, { passive: true });
    prevBtn.addEventListener('touchend', (e) => { e.stopPropagation(); stopSeeking('rw'); });

    // Upload Handler
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        saveFilesToDB(e.target.files);
      }
    });

    // Initial Render
    renderMenu();
  </script>
</body>
</html>
